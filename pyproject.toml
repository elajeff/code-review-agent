[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent"
version = "0.1.0"
description = "A small evidence-based AI code reviewer for Python Git diffs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.75.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
code-review-agent = "review_agent.cli:main"

[tool.setuptools.packages.find]
include = ["review_agent*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
review_agent = ["data/*.json"]
